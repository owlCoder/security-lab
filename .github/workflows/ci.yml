name: Starter checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build API starter
        run: dotnet build backend/Platform.Api/Platform.Api.csproj --configuration Release
      - name: Check access KT1 material
        run: python3 scripts/check-access-kt1.py
      - name: Test ACC-04 and ACC-08
        run: dotnet test backend/Platform.Access.Tests/Platform.Access.Tests.csproj --configuration Release --logger "trx;LogFileName=access-kt1.trx" --results-directory TestResults
      - name: Upload access test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-kt1-test-results
          path: TestResults/
          if-no-files-found: warn
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
